<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Repair status</title>
  <link rel="stylesheet" href="/app.css">
  <style>
    .wrap { max-width: 560px; margin: 0 auto; padding: 24px 16px; }
    .steps { list-style: none; padding: 0; margin: 16px 0; }
    .steps li { display: flex; gap: 10px; align-items: center; padding: 6px 0; color: var(--muted); }
    .steps li i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); flex: none; }
    .steps li.done { color: var(--ink); } .steps li.done i { background: var(--brand); border-color: var(--brand); }
    .steps li.now { color: var(--brand); font-weight: 700; } .steps li.now i { border-color: var(--brand); box-shadow: 0 0 0 4px var(--brand-soft); }
  </style>
</head>
<body>
  <div class="wrap" id="app"><div class="muted">Loading…</div></div>
  <script src="/track.js"></script>
</body>
</html>
